quarkus.container-image.build=true
quarkus.container-image.push=true
quarkus.container-image.registry=docker-registry.skworks.tech
quarkus.container-image.group=skworks
quarkus.container-image.name=tachyon-service
quarkus.container-image.tag=2.0.0-SNAPSHOT
quarkus.container-image.insecure=true
quarkus.container-image.builder=jib
quarkus.jib.platforms=linux/amd64

quarkus.application.name=Tachyon-Primary
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{trace_id}, parentId=%X{parent_id}, spanId=%X{span_id}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n

quarkus.grpc.server.max-inbound-message-size=33554432
quarkus.grpc.server.netty.permit-keep-alive-without-calls=true
quarkus.grpc.server.netty.permit-keep-alive-time=PT10S

quarkus.redis.max-pool-size=128
quarkus.redis.max-pool-waiting=4096
quarkus.redis.timeout=PT10S

quarkus.otel.exporter.otlp.enabled=true
quarkus.otel.exporter.otlp.endpoint=http://jaeger:4317
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=0.05

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.mongodb.database=tachyon
quarkus.mongodb.max-pool-size=60
quarkus.mongodb.min-pool-size=20
quarkus.mongodb.read-timeout=PT20S
quarkus.mongodb.server-selection-timeout=PT10S
quarkus.mongodb.connect-timeout=PT10S
quarkus.mongodb.max-connection-idle-time=PT30S
quarkus.mongodb.write-concern.w=1
quarkus.mongodb.write-concern.journal=false
quarkus.mongodb.read-preference=primaryPreferred
